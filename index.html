    <style>
        /* Custom iOS Scrollbar & Device Frame Styling */
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        
        body {
            background: radial-gradient(circle at 20% 20%, #162238 0%, #090D16 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Hide scrollbars inside the iPhone viewport while maintaining scrollability */
        .ios-scroll::-webkit-scrollbar {
            display: none;
        }
        .ios-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* iPhone 15/16 Pro Titanium Bezel on Desktop */
        @media (min-width: 640px) {
            .iphone-chassis {
                width: 402px;
                height: 852px;
                border-radius: 56px;
                background: linear-gradient(145deg, #3a3d42, #1f2124, #34373c);
                padding: 12px;
                box-shadow: 
                    0 0 0 2px #52565e,
                    0 30px 70px -15px rgba(0, 0, 0, 0.85),
                    0 0 40px rgba(16, 185, 129, 0.12),
                    inset 0 0 8px rgba(255, 255, 255, 0.25);
                position: relative;
            }
            .iphone-screen {
                border-radius: 45px;
                overflow: hidden;
                height: 100%;
                width: 100%;
            }
            /* Side Hardware Buttons */
            .hw-btn-left-1 { position: absolute; left: -3px; top: 125px; width: 3px; height: 28px; background: #4a4d52; border-radius: 2px 0 0 2px; }
            .hw-btn-left-2 { position: absolute; left: -3px; top: 175px; width: 3px; height: 52px; background: #4a4d52; border-radius: 2px 0 0 2px; }
            .hw-btn-left-3 { position: absolute; left: -3px; top: 240px; width: 3px; height: 52px; background: #4a4d52; border-radius: 2px 0 0 2px; }
            .hw-btn-right   { position: absolute; right: -3px; top: 200px; width: 3px; height: 78px; background: #4a4d52; border-radius: 0 2px 2px 0; }
        }

        @media (max-width: 639px) {
            body {
                background: #F4F5F8;
            }
            .iphone-chassis {
                width: 100vw;
                height: 100dvh;
            }
            .iphone-screen {
                width: 100%;
                height: 100%;
            }
        }

        /* Frosted Glass Tab Bar */
        .ios-frosted {
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Smooth Progress Ring Transition */
        .ring-circle {
            transition: stroke-dashoffset 0.75s cubic-bezier(0.22, 1, 0.36, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Subtle Card Lift */
        .ios-card {
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(11, 23, 42, 0.045), 0 1px 2px rgba(11, 23, 42, 0.03);
            border: 1px solid rgba(226, 232, 240, 0.75);
        }

        /* View Transition */
        .tab-view {
            animation: fadeSlideIn 0.24s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Pulse for Recording */
        @keyframes pulseRing {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-pulse {
            animation: pulseRing 1.5s infinite;
        }
    </style>
</head>

    <script>
        /* ==========================================================================
           1. DATA REPOSITORY (C2 LEXICON, WRITING PROMPTS, SPEAKING CARDS, DRILLS)
           ========================================================================== */
        const WORD_OF_THE_DAY_LIST = [
            {
                word: "Ubiquitous",
                phonetic: "/juːˈbɪk.wɪ.təs/",
                pos: "adjective • C2 Academic",
                definition: "Present, appearing, or found everywhere simultaneously; inescapable in modern life.",
                example: "The ubiquitous nature of algorithmic curation has subtly reshaped public discourse and epistemic trust.",
                synonymFrom: "very common / everywhere"
            },
            {
                word: "Exacerbate",
                phonetic: "/ɪɡˈzæs.ə.beɪt/",
                pos: "verb • C2 Academic",
                definition: "To make a problem, bad situation, or negative feeling markedly worse.",
                example: "Unregulated urban sprawl continues to exacerbate infrastructural bottlenecks in megacities.",
                synonymFrom: "make worse"
            },
            {
                word: "Dichotomy",
                phonetic: "/daɪˈkɒt.ə.mi/",
                pos: "noun • C2 Academic",

                example: "Policymakers often grapple with the false dichotomy between economic growth and ecological preservation.",

        const LEXICON_UPGRADES = [
            {
                id: "lex1",
                theme: "Environment",
                band7: "Governments must make strict laws to stop companies from polluting rivers and damaging nature.",
                band9: "Governments must enact stringent legislation to deter corporations from discharging effluent and degrading fragile ecosystems.",

            {

                id: "lex4",

                highlights: [
                    { phrase: "cultivate critical inquiry", note: "Natural academic verb-noun pairing" },
                    { phrase: "rote memorization", note: "Exact idiomatic term for memorizing without understanding" }
                ]
            },
            {
                id: "lex5",
                theme: "Health",
                band7: "Eating unhealthy fast food and not exercising causes many people to become overweight and sick.",
                band9: "The proliferation of ultra-processed diets coupled with sedentary lifestyles has precipitated a surge in chronic metabolic disorders.",
                highlights: [
                    { phrase: "sedentary lifestyles", note: "Essential Band 8–9 health collocation" },
                    { phrase: "chronic metabolic disorders", note: "Clinical precision replacing 'become sick'" }
                ]
            }
        ];

        const COLLOCATIONS_DB = [
            { term: "Mitigate the adverse effects", cat: "Cause & Effect", meaning: "Reduce the harmful impact of something", ex: "Reforestation initiatives help mitigate the adverse effects of carbon emissions." },
            { term: "A double-edged sword", cat: "Idiomatic", meaning: "Something having both favorable and unfavorable consequences", ex: "Hyper-connectivity is a double-edged sword that fosters collaboration while eroding privacy." },
            { term: "Inextricably linked", cat: "Academic", meaning: "Impossible to separate or disentangle", ex: "Public health outcomes are inextricably linked to socioeconomic status." },
            { term: "Albeit", cat: "Discourse Marker", meaning: "Although; notwithstanding", ex: "The policy proved effective, albeit costly to implement initially." },
            { term: "Paramount importance", cat: "Emphasis", meaning: "More important than anything else", ex: "Equitable access to primary healthcare is of paramount importance." },
            { term: "Stem the tide of", cat: "Idiomatic", meaning: "Stop something undesirable from spreading", ex: "Strict digital literacy programs may help stem the tide of misinformation." },
            { term: "Notwithstanding", cat: "Discourse Marker", meaning: "In spite of; nevertheless", ex: "Notwithstanding fiscal constraints, investment in renewable infrastructure remains vital." },
            { term: "Proliferation of", cat: "Academic", meaning: "Rapid increase in numbers or spread", ex: "The proliferation of remote work has transformed urban commuting patterns." }
        ];

        const WRITING_PROMPTS = [
            {
                id: "t2_tech",
                type: "Task 2 • Opinion / Discussion",
                mins: 40,
                targetWords: 250,
                prompt: "Some people believe that unpaid community service should be a compulsory part of high school programs. To what extent do you agree or disagree?",
                modelSegments: [
                    { text: "In recent years, the integration of mandatory civic engagement into secondary education has sparked considerable debate. ", type: "normal" },
                    { text: "While critics contend that compulsory volunteering infringes upon students' autonomy, I firmly believe that such initiatives yield profound pedagogical and societal dividends.", type: "thesis", note: "Band 9.0 Thesis: Uses concessive 'While...' clause + 'pedagogical and societal dividends' (C2 collocation)." },
                    { text: "\n\nPrimarily, structured community service cultivates empathy and social responsibility during a formative stage of adolescence. ", type: "cohesion", note: "Cohesive Progression: 'Primarily' + 'formative stage of adolescence' sets a crisp topic sentence." },

                    { text: "\n\nAdmittedly, detractors argue that coerced altruism is a contradiction in terms and may overburden exam-focused pupils. ", type: "lexical", note: "Lexical Precision: 'coerced altruism is a contradiction in terms' shows effortless C2 idiomatic control." },

            {
                id: "t1_chart",
                type: "Task 1 • Academic Data",
                mins: 20,
                targetWords: 150,
                prompt: "The line graph illustrates the proportion of electricity generated from renewable sources in four European nations between 2005 and 2025.",

                    { text: "The line graph compares the percentage of electrical power derived from renewable energy across four European countries over a two-decade period starting in 2005. ", type: "normal" },
                    { text: "Overall, all four nations experienced a marked upward trajectory in green energy adoption, with Denmark consistently outperforming its counterparts.", type: "thesis", note: "Band 9.0 Overview: Synthesizes the main trend ('marked upward trajectory') without listing raw numbers prematurely." },

        const SPEAKING_CARDS = [
            {
                part: "Part 2 • Long Turn",
                topic: "Describe a piece of technology you find difficult to live without.",

                    "What the technology is",
                    "How frequently you rely on it",

                sampleHtml: `

                markers: ["Off the top of my head (Natural opener)", "nothing short of overwhelming (C2 emphasis)", "By and large (Idiomatic summary)"]

            {
                part: "Part 2 • Long Turn",
                topic: "Describe an environmental problem that has been in the news recently.",
                bullets: [
                    "What the environmental issue is",
                    "Where it is occurring",
                    "What the primary causes are",

                sampleHtml: `

                    <p class="mb-2.5">What makes this particularly alarming is the <span class="bg-emerald-100 text-emerald-900 px-1.5 py-0.5 rounded font-medium">domino effect</span> it triggers across marine biodiversity and coastal livelihoods.</p>

                `,
                markers: ["If memory serves me right (Authentic hesitation filler)", "domino effect (Idiomatic metaphor)", "At the end of the day (Natural conclusion)"]
            }
        ];

        const PRECISION_DRILLS = [
            {
                id: "d1",
                skill: "Reading • True / False / Not Given",
                passage: "While early proponents of urban vertical farming predicted it would replace traditional agriculture within decades, recent economic audits indicate that high energy expenditure restricts its commercial viability primarily to high-margin leafy greens and herbs.",

                options: ["TRUE", "FALSE", "NOT GIVEN"],
                correct: 1,

            },
            {
                id: "d2",

        let toastTimeout = null;
        function showToast(title, msg, icon = '✓') {
            const toast = document.getElementById('ios-toast');
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('toast-icon').textContent = icon;
            
            toast.classList.remove('opacity-0', '-translate-y-3', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-3', 'pointer-events-none');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2600);
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) {
                showToast('Audio Unavailable', 'Speech synthesis is not supported in this browser.', '!');
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.92;
            const voices = window.speechSynthesis.getVoices();
            const ukVoice = voices.find(v => v.lang.includes('en-GB') && v.name.includes('Daniel')) 
                         || voices.find(v => v.lang.includes('en-GB')) 
                         || voices.find(v => v.lang.includes('en'));
            if (ukVoice) utterance.voice = ukVoice;
            
            document.getElementById('island-status').textContent = 'SPEAKING...';
            utterance.onend = () => {
                document.getElementById('island-status').textContent = 'BAND 9.0';
            };
            window.speechSynthesis.speak(utterance);
        }

            const { listening, reading, writing, speaking } = appState.scores;

        function buildProgressRing(label, score, colorHex) {
            const radius = 24;
            const circumference = 2 * Math.PI * radius;
            const pct = Math.min(100, Math.max(0, (score / 9.0) * 100));
            const offset = circumference - (pct / 100) * circumference;

            return `
                <div class="flex flex-col items-center">
                    <div class="relative w-16 h-16 flex items-center justify-center">
                        <svg class="w-16 h-16" viewBox="0 0 60 60">
                            <circle cx="30" cy="30" r="${radius}" fill="none" stroke="#E2E8F0" stroke-width="5"></circle>
                            <circle class="ring-circle" cx="30" cy="30" r="${radius}" fill="none" stroke="${colorHex}" stroke-width="5" stroke-linecap="round"
                                stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
                        </svg>
                        <span class="absolute text-sm font-bold text-slate-900">${score.toFixed(1)}</span>
                    </div>
                    <span class="text-[11px] font-medium text-slate-500 mt-1">${label}</span>
                </div>

        function analyzeEssay() {
            const text = appState.writingDraft.trim();
            const wc = countWords(text);
            if (wc < 20) {
                showToast('Draft Too Short', 'Write at least 20 words (or tap + Sample Intro) to analyze.', '✍️');
                return;
            }

            // Heuristic Lexical & Structural Analysis
            const lower = text.toLowerCase();
            const basicWordsMap = [
                { basic: /\bvery\b/g, suggest: 'markedly / profoundly / acutely' },
                { basic: /\bgood\b/g, suggest: 'beneficial / advantageous / salutary' },
                { basic: /\bbad\b/g, suggest: 'detrimental / deleterious / adverse' },
                { basic: /\bbig\b/g, suggest: 'substantial / considerable / monumental' },
                { basic: /\bpeople think\b/g, suggest: 'proponents contend / critics argue' },
                { basic: /\bnowadays\b/g, suggest: 'in the contemporary era / increasingly' }
            ];

            const upgradesFound = [];
            basicWordsMap.forEach(item => {
                if (item.basic.test(lower)) {
                    upgradesFound.push(`Replace basic <strong>"${item.basic.source.replace(/\\b/g, '')}"</strong> → <em>${item.suggest}</em>`);
                }
            });

            const cohesiveMarkers = ['while', 'whereas', 'nevertheless', 'conversely', 'moreover', 'furthermore', 'consequently', 'albeit', 'admittedly', 'primarily'];
            const usedMarkers = cohesiveMarkers.filter(m => new RegExp(`\\b${m}\\b`, 'i').test(text));

            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
            const avgSentenceLen = sentences.length ? Math.round(wc / sentences.length) : 0;

            // Calculate estimated band score
            let estBand = 7.0;
            if (wc >= 140) estBand += 0.5;
            if (usedMarkers.length >= 2) estBand += 0.5;
            if (avgSentenceLen >= 16 && avgSentenceLen <= 32) estBand += 0.5;
            if (upgradesFound.length === 0 && wc >= 60) estBand += 0.5;
            estBand = Math.min(9.0, estBand);

            appState.scores.writing = Math.max(appState.scores.writing, estBand);
            saveState();

            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between">

                    </div>

                        </div>
                        <div class="ios-card p-2.5">
                            <span class="text-[10px] text-slate-400 block">Avg Sentence</span>
                            <span class="text-sm font-bold text-navy-900">${avgSentenceLen} words</span>
                        </div>
                        <div class="ios-card p-2.5">
                            <span class="text-[10px] text-slate-400 block">Cohesive Links</span>
                            <span class="text-sm font-bold text-emerald-600">${usedMarkers.length} detected</span>
                        </div>
                    </div>

                    <div class="ios-card p-3.5 space-y-2">
                        <h4 class="text-xs font-bold text-navy-900 uppercase tracking-wider">Lexical Upgrade Suggestions</h4>
                        ${upgradesFound.length > 0 ? `
                            <ul class="space-y-1.5 text-xs text-slate-700">
                                ${upgradesFound.map(u => `<li class="flex items-start gap-2"><span class="text-amber-500">▲</span><span>${u}</span></li>`).join('')}
                            </ul>
                        ` : `
                            <p class="text-xs text-emerald-700 font-medium">✓ Zero elementary filler words detected. Strong C2 register maintained.</p>
                        `}
                    </div>

                    <div class="ios-card p-3.5 space-y-1.5">
                        <h4 class="text-xs font-bold text-navy-900 uppercase tracking-wider">Cohesion & Grammatical Range</h4>
                        <p class="text-xs text-slate-600 leading-relaxed">
                            ${usedMarkers.length > 0 
                                ? `Detected sophisticated discourse markers: <strong>${usedMarkers.join(', ')}</strong>. Ensure complex subordinate clauses are balanced with crisp topic sentences.`

            `);
        }

        async function toggleAudioRecording() {
            if (isRecordingAudio) {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                isRecordingAudio = false;
                renderSpeaking(document.getElementById('app-viewport'));
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast('Mic Unavailable', 'Microphone access is restricted in this preview frame.', '🎙');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    recordedAudioUrl = URL.createObjectURL(blob);
                    stream.getTracks().forEach(t => t.stop());
                    showToast('Recording Saved', 'Tap Play to audit your fluency and pronunciation.', '✓');
                    if (appState.activeTab === 'speaking') renderSpeaking(document.getElementById('app-viewport'));
                };
                mediaRecorder.start();
                isRecordingAudio = true;
                showToast('Recording Live...', 'Speak clearly at a natural academic pace.', '🎙');
                renderSpeaking(document.getElementById('app-viewport'));
            } catch (err) {
                showToast('Mic Permission Needed', 'Enable microphone permissions in browser settings.', '!');
            }
        }

        function answerDrill(drillId, chosenIdx) {
            const drill = PRECISION_DRILLS.find(d => d.id === drillId);
            if (!drill) return;

            const buttons = document.querySelectorAll(`.drill-opt-${drillId}`);
            buttons.forEach((btn, idx) => {
                btn.classList.remove('bg-emerald-50', 'border-emerald-500', 'text-emerald-900', 'bg-rose-50', 'border-rose-400', 'text-rose-900');
                const badge = btn.querySelector('.opt-badge');
                if (idx === drill.correct) {
                    btn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-900');
                    badge.textContent = '✓';
                } else if (idx === chosenIdx && chosenIdx !== drill.correct) {
                    btn.classList.add('bg-rose-50', 'border-rose-400', 'text-rose-900');
                    badge.textContent = '✕';
                } else {
                    badge.textContent = '';
                }
            });

            const expBox = document.getElementById(`drill-exp-${drillId}`);
            if (expBox) expBox.classList.remove('hidden');

            if (chosenIdx === drill.correct) {
                if (!appState.completedDrills.includes(drillId)) {
                    appState.completedDrills.push(drillId);
                    appState.scores.reading = Math.min(9.0, +(appState.scores.reading + 0.1).toFixed(1));

                            <h3 class="text-lg font-extrabold text-navy-900">Band 9.0 Rapid Check</h3>
                        </div>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 font-bold text-sm">✕</button>
                    </div>

                    <div class="ios-card p-3.5 bg-slate-50">
                        <p class="text-xs text-slate-700 font-serif leading-relaxed">${q1.passage}</p>
                    </div>

                    <p class="text-xs font-bold text-navy-900">${q1.question}</p>

                    <div class="space-y-2">
                        ${q1.options.map((opt, idx) => `
                            <button onclick="handleQuickDrillAnswer(${idx === q1.correct})" class="w-full py-3 px-4 rounded-xl bg-white border border-slate-200 text-xs font-bold text-navy-900 hover:bg-emerald-50 hover:border-emerald-400 transition text-left">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `);
        }

        function handleQuickDrillAnswer(isCorrect) {
            if (isCorrect) {
                appState.scores.reading = Math.min(9.0, +(appState.scores.reading + 0.1).toFixed(1));
                saveState();
                closeModal();
                showToast('Sprint Complete! +0.1 Band', 'Flawless T/F/NG discrimination.', '🔥');
                if (appState.activeTab === 'home') renderHome(document.getElementById('app-viewport'));
            } else {
                showToast('Watch the Qualifier!', 'Re-read "restricts its commercial viability primarily to..."', '!');
            }
        }

        /* ==========================================================================
           6. INITIALIZE APPLICATION ON LOAD
           ========================================================================== */
        window.onload = function() {
            switchTab(appState.activeTab || 'home');
        };
    </script>
</body>
</html>
